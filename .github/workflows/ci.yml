name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true
          cache-dependency-path: go.sum
      - name: Verify module files
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check gofmt
        run: |
          echo "Checking gofmt..."
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt -s (please run 'gofmt -s -w .' locally):"
            echo "$files"
            exit 1
          fi
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet -mod=readonly ./...

      - name: Run race-enabled unit tests
        run: |
          go test -race -v -mod=readonly ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, freebsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Build
        run: |
          make GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} plex-exporter

      - name: Package binary
        shell: bash
        run: |
          archive="plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          staging="$(mktemp -d)"
          mkdir -p dist
          install -m 0755 "./bin/${{ matrix.goos }}/plex-exporter-${{ matrix.goarch }}" "$staging/plex-exporter"
          install -m 0644 LICENSE "$staging/LICENSE"
          tar -C "$staging" -czf "dist/$archive" plex-exporter LICENSE
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ./dist/plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            ./dist/plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  container:
    name: Container image
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=cacheonly
