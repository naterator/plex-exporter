# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-binaries:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }} binary
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'naterator/plex-exporter' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are the supported Unix-like targets. Keep the matrix explicit
        # so an unsupported GOOS/GOARCH pair cannot be advertised accidentally.
        goos: [linux, darwin, freebsd]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      - name: Build binary
        run: make GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} plex-exporter

      - name: Package binary
        shell: bash
        run: |
          archive="plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          staging="$(mktemp -d)"
          mkdir -p dist
          install -m 0755 "./bin/${{ matrix.goos }}/plex-exporter-${{ matrix.goarch }}" "$staging/plex-exporter"
          install -m 0644 LICENSE "$staging/LICENSE"
          tar -C "$staging" -czf "dist/$archive" plex-exporter LICENSE
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ./dist/plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            ./dist/plex-exporter-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish multi-platform container image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'naterator/plex-exporter' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run checks out the default branch unless the tested SHA is
          # supplied explicitly. Publish exactly the commit that CI validated.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get version info
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "git_sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.git_sha }}
            GIT_REVISION=${{ steps.version.outputs.git_sha }}
            GIT_BRANCH=${{ steps.version.outputs.branch }}
          tags: |
            ghcr.io/naterator/plex-exporter:latest
            ghcr.io/naterator/plex-exporter:${{ steps.version.outputs.git_sha }}

      - name: Create composite tag and push
        run: |
          # extract manifest digest from build action output
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "No digest found from build step; aborting"
            exit 1
          fi
          # strip optional 'sha256:' prefix and use the full hex digest so the tag
          # can be mapped directly back to the manifest used for docker pull.
          docker_digest_hex=$(echo "$digest" | sed -E 's/^sha256://g')
          git_sha=${{ steps.version.outputs.git_sha }}
          composite_tag="ghcr.io/naterator/plex-exporter:sha256-${docker_digest_hex}-${git_sha}"
          echo "Composite tag: $composite_tag"
          # Copy the manifest list rather than pulling and retagging the runner's
          # native image, which would silently collapse the tag to one platform.
          docker buildx imagetools create \
            --tag "$composite_tag" \
            "ghcr.io/naterator/plex-exporter@${digest}"
          docker buildx imagetools inspect "$composite_tag"
